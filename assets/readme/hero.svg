<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">UserHali</title>
  <desc id="desc">Security-aware software: Android, web, APIs, and reverse engineering. Build it, trace the boundary, explain the risk.</desc>

  <defs>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#07090C"/>
    <rect x="0" y="0" width="8" height="300" fill="#7EB0D6"/>
    <path d="M56 214H1144" stroke="#24303A" stroke-width="1"/>

    <text x="56" y="58" fill="#7EB0D6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">HALICHINA / PROFILE</text>
    <text x="56" y="128" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800">UserHali</text>
    <text x="56" y="176" fill="#B7C0C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22">Build it. Trace the boundary. Explain the risk.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#D5DDE4">
      <text x="56" y="258">Android</text>
      <text x="196" y="258">Web</text>
      <text x="292" y="258">API</text>
      <text x="388" y="258">Reverse Engineering</text>
    </g>
    <text x="980" y="258" fill="#6E7A84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">@haliChina</text>
  </g>
</svg>
